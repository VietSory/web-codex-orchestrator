name: Maintainer unit diagnosis

on:
  pull_request:
    branches:
      - agent/v0.3.3-gh-cli-compat

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture unit output
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm test > maintainer-unit.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload unit output
        uses: actions/upload-artifact@v4
        with:
          name: maintainer-unit-log
          path: maintainer-unit.log
          if-no-files-found: error
          retention-days: 1
      - name: Preserve failing status
        shell: bash
        run: test "${{ steps.unit.outputs.exit_code }}" -eq 0
