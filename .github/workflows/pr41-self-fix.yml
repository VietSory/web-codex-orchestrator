name: PR41 bounded self-fix

on:
  push:
    branches:
      - ux/cli-pattern-parity
    paths:
      - .github/workflows/pr41-self-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ux/cli-pattern-parity
          fetch-depth: 1
      - name: Wire returning-user shortcuts through the existing TUI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/cli/index.ts")
          source = path.read_text(encoding="utf-8")

          import_old = 'import { runInteractiveApp } from "../tui/interactive-app.js";\n'
          import_new = import_old + 'import { terminalIo, type InteractiveIo } from "../tui/session.js";\n'
          if 'from "../tui/session.js"' not in source:
              if import_old not in source:
                  raise SystemExit("interactive app import anchor not found")
              source = source.replace(import_old, import_new, 1)

          helper_anchor = 'async function main(): Promise<void> {\n'
          helpers = r'''function startupInteractiveIo(startupCommand: string): InteractiveIo {
            const io = terminalIo();
            let pending = true;
            return {
              ...io,
              composer: async (prompt, options) => {
                if (pending) {
                  pending = false;
                  return startupCommand;
                }
                return io.composer ? await io.composer(prompt, options) : await io.question(prompt);
              },
            };
          }

          async function runInteractiveShortcut(first: string, args: string[]): Promise<boolean> {
            if (first !== "--continue" && first !== "--resume") return false;
            if (!process.stdin.isTTY || !process.stdout.isTTY) {
              process.stderr.write("Interactive WCO shortcuts require a TTY. Run `wco` inside a terminal.\n");
              process.exitCode = 2;
              return true;
            }
            if (first === "--continue") {
              if (args.length !== 1) {
                process.stderr.write("Usage: wco --continue\n");
                process.exitCode = 2;
                return true;
              }
              process.exitCode = await runInteractiveApp(startupInteractiveIo("/continue"));
              return true;
            }
            if (args.length > 2 || args[1] !== undefined && !/^\d+$/u.test(args[1])) {
              process.stderr.write("Usage: wco --resume [history-number]\n");
              process.exitCode = 2;
              return true;
            }
            const startupCommand = args[1] ? `/resume ${args[1]}` : "/resume";
            process.exitCode = await runInteractiveApp(startupInteractiveIo(startupCommand));
            return true;
          }

          '''
          if 'function startupInteractiveIo' not in source:
              if helper_anchor not in source:
                  raise SystemExit("main anchor not found")
              source = source.replace(helper_anchor, helpers + helper_anchor, 1)

          main_old = '''async function main(): Promise<void> {
            const [, , command, ...args] = process.argv;
            if (command === undefined) {
          '''
          main_new = '''async function main(): Promise<void> {
            const cliArgs = process.argv.slice(2);
            const first = cliArgs[0];
            if (first !== undefined && await runInteractiveShortcut(first, cliArgs)) return;
            const [command, ...args] = cliArgs;
            if (command === undefined) {
          '''
          if 'const cliArgs = process.argv.slice(2);' not in source:
              if main_old not in source:
                  raise SystemExit("main destructuring anchor not found")
              source = source.replace(main_old, main_new, 1)

          path.write_text(source, encoding="utf-8")
          PY
          git diff --check
          git diff -- src/cli/index.ts
      - name: Commit bounded fix
        shell: bash
        run: |
          if git diff --quiet -- src/cli/index.ts; then
            echo "No patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cli/index.ts
          git commit -m "fix(cli): wire returning-user continuation shortcuts"
          git push origin HEAD:ux/cli-pattern-parity
