name: Phase 16 lockfile sync

on:
  push:
    branches:
      - codex/phase-16-final-hardening-v2

permissions:
  contents: write

concurrency:
  group: phase16-lockfile-sync
  cancel-in-progress: false

jobs:
  sync:
    if: contains(github.event.head_commit.message, '[sync-lock]') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate package lock metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "Phase 16: synchronize package-lock metadata"
          git push origin "HEAD:${GITHUB_REF_NAME}"
