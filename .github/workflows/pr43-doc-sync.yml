name: PR43 continuation doc sync

on:
  push:
    branches:
      - fix/pr41-cli-shortcuts
    paths:
      - .github/workflows/pr43-doc-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/pr41-cli-shortcuts
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Make docs match least-surprise continuation semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            Path("README.md"): [
              (
                "Then give WCO a goal. If you already have saved work, use `/continue` to continue the current task. When there is no current unfinished task, `/continue` can return to the most recent safely resumable task. Use `/resume` when you want to deliberately choose a different saved task; `/resume <number>` selects the matching `/history` item.",
                "Then give WCO a goal. If you already have an unfinished current task, use `/continue` to continue that exact task. If there is no current task, or the current task is already complete, `/continue` does not change focus: type a new follow-up goal, or use `/resume` when you intentionally want to choose a different saved task. `/resume <number>` selects the matching `/history` item after durable re-attestation."
              ),
              (
                "/continue               continue current saved work or the latest safely resumable task",
                "/continue               continue only the current unfinished saved task"
              ),
            ],
            Path("docs/v03-ux-completion.md"): [
              (
                "`/continue` is the normal one-step continuation command. It continues the current saved task when one exists; otherwise it can return to the most recent task that still has locally re-attestable durable authority. A blocked current task never causes `/continue` to jump silently to older work: the user resolves that task with `/status`, `/review`, and `/doctor`, or explicitly chooses another task through `/resume`. `/resume` opens the recent-task picker, and `/resume <number>` selects the matching history item.",
                "`/continue` is the normal one-step continuation command for the current unfinished saved task only. It never changes task focus by selecting historical work implicitly. If the current task is complete or no current task exists, the user starts a new follow-up goal or explicitly chooses saved work through `/resume`. A blocked current task remains current until the user resolves it with `/status`, `/review`, and `/doctor`, or deliberately switches through `/resume`. `/resume` opens the recent-task picker, and `/resume <number>` selects the matching history item after durable re-attestation."
              ),
            ],
          }

          for path, pairs in replacements.items():
            source = path.read_text(encoding="utf-8")
            for old, new in pairs:
              if old not in source:
                raise SystemExit(f"documentation anchor not found in {path}: {old[:80]}")
              source = source.replace(old, new, 1)
            path.write_text(source, encoding="utf-8")
          PY
          git diff --check
      - name: Verify UX contracts
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npx tsx --test tests/tui-cli-shortcuts.test.ts tests/tui-continue-least-surprise.test.ts tests/user-experience-contract.test.ts
      - name: Commit doc synchronization and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr43-doc-sync.yml
          git add README.md docs/v03-ux-completion.md
          git diff --cached --check
          git commit -m "docs(ux): align continue and resume semantics"
          git push origin HEAD:fix/pr41-cli-shortcuts
