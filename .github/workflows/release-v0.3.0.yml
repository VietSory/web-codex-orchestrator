name: One-time v0.3.0 release

on:
  push:
    branches:
      - feat/v0.3-interactive-web-bridge
    paths:
      - .github/workflows/release-v0.3.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: e4f6f0e64e3952121dc0672d0e627c60f8ff8f52
      TAG: v0.3.0
    steps:
      - name: Checkout exact release target
        uses: actions/checkout@v5
        with:
          ref: e4f6f0e64e3952121dc0672d0e627c60f8ff8f52
          fetch-depth: 1

      - name: Verify exact release target
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          test "$(node -p "require('./package.json').version")" = "0.3.0"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify package surface
        run: npm run pack:check

      - name: Build release package and checksum
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          pack_json="$(npm pack --json)"
          pack_file="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x[0].filename)' "$pack_json")"
          sha256sum "$pack_file" > "$pack_file.sha256"
          echo "file=$pack_file" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$pack_file" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## WCO v0.3.0

          The interactive Web-Bridge release of Web Codex Orchestrator.

          v0.3 keeps the hardened v0.2 execution/review engine and adds the product layer needed for a normal developer workflow: run `wco` inside a Git repository, enter a rough goal, let ChatGPT Web author and seal the engineering contract, then let WCO coordinate exact local validation, Codex implementation, independent Terra/Sol review, Draft PR delivery, and final Web review.

          ### Highlights

          - Interactive no-argument `wco` terminal UX and slash command palette.
          - First-run repository/project/Codex/GitHub discovery without hand-editing JSON.
          - Authenticated ChatGPT Web relay with exact-base, bounded Git-object repository reads.
          - Automatic Task Bundle and Web Implementation Pack materialization; no normal-user ZIP/Downloads handoff.
          - One-time `/web connect`, automatic Senior Architect GPT opening, and bridge-backed final verdict return.
          - User-facing `/review`, `/history`, `/config`, `/pause`, `/resume`, `/doctor`, and safe `/uninstall` flows.
          - Exact read-coverage/preimage binding for Web-authored replace/delete operations.
          - Existing human-only merge/release/deployment authority remains unchanged.

          ### Validation

          - Release target: `e4f6f0e64e3952121dc0672d0e627c60f8ff8f52`.
          - GitHub-signed merge commit from PR #27.
          - Exact-head PR CI #718: PASS.
          - Exact merged-main CI #719: PASS.
          - Package version: `0.3.0`.
          - Node.js 22+; bundled Codex runtime remains pinned to `0.145.0`.
          - Native sandbox and real Codex/Terra/Sol gates were completed during v0.3 implementation validation; this remains a pre-release pending broader hosted Web-Bridge dogfooding.

          ### Important

          This is a pre-release for technical evaluation. The package remains private on npm; install from the attached `.tgz`. A hosted HTTPS relay and configured WCO Senior Architect GPT are required for the automatic ChatGPT Web path. The local reference relay and manual transport remain available for development/backward compatibility.
          EOF

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "${{ steps.pack.outputs.file }}" \
            "${{ steps.pack.outputs.file }}.sha256" \
            --repo "${{ github.repository }}" \
            --target "$TARGET_SHA" \
            --title "WCO v0.3.0" \
            --notes-file RELEASE_NOTES.md \
            --prerelease

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "${{ github.repository }}" --json tagName,isDraft,isPrerelease,targetCommitish,url
          echo "Package SHA-256: ${{ steps.pack.outputs.sha256 }}"
