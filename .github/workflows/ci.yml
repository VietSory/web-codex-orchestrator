name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      WCO_RUN_CODEX_INTEGRATION: "0"
      WCO_RUN_SANDBOX_INTEGRATION: "0"
      WCO_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.WCO_EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm exact checkout identity
        shell: bash
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$WCO_EXPECTED_SHA" ]; then
            echo "Expected exact head $WCO_EXPECTED_SHA but checked out $actual_sha" >&2
            exit 1
          fi
          echo "Exact head: $actual_sha"

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm pinned Codex packages
        run: |
          npm ls @openai/codex
          npm ls @openai/codex-sdk

      - name: Validate bundle template
        run: npm run validate -- ./templates/task-bundle

      - name: Typecheck
        run: npm run typecheck

      # The unit runner already executes each top-level test file in its own
      # bounded process and prints the file name before execution. Avoid
      # duplicating Phase 9/10 suites here on every commit; explicit phase
      # release gates still run their targeted suites before a phase is frozen.
      - name: Unit and fake integration tests
        run: npm test

      - name: Phase 8 fake end-to-end
        run: npm run test:phase8-e2e
        timeout-minutes: 2

      - name: Build
        run: npm run build

      - name: Compiled CLI integration test
        run: npm run test:cli
