name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      WCO_RUN_CODEX_INTEGRATION: "0"
      WCO_RUN_SANDBOX_INTEGRATION: "0"
      WCO_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v5
        with:
          ref: ${{ env.WCO_EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm exact checkout identity
        shell: bash
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$WCO_EXPECTED_SHA" ]; then
            echo "Expected exact head $WCO_EXPECTED_SHA but checked out $actual_sha" >&2
            exit 1
          fi
          echo "Exact head: $actual_sha"

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm pinned Codex runtime
        run: |
          npm ls @openai/codex
          npm ls @openai/codex-sdk

      - name: Validate bundle template
        run: npm run validate:template

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and deterministic integration tests
        run: npm test

      - name: Deterministic context benchmark
        run: npm run benchmark:context

      - name: End-to-end workflow test
        run: npm run test:e2e
        timeout-minutes: 2

      - name: Build
        run: npm run build

      - name: Compiled CLI integration tests
        run: npm run test:cli

      - name: Verify distributable package surface
        run: npm run pack:check
