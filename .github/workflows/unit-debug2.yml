name: Unit Debug Annotated

on:
  push:
    branches:
      - agent/autopilot-repair-loop

permissions:
  contents: read

jobs:
  unit-debug-annotated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unit tests and surface failures
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee unit-test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          import re
          text = Path('unit-test.log').read_text(errors='replace').splitlines()
          interesting=[]
          for i,line in enumerate(text):
              if re.search(r'(^not ok\b|failureType:|error:|AssertionError|ERR_ASSERTION|testCodeFailure|fail [1-9])', line, re.I):
                  start=max(0,i-3); end=min(len(text),i+9)
                  interesting.extend(text[start:end])
          if not interesting:
              interesting=text[-120:]
          payload=' | '.join(interesting[-160:])[:6000]
          payload=payload.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f'::error title=WCO unit tests failed::{payload}')
          PY
          fi
          exit "$code"
