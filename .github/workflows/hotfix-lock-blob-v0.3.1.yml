name: Stage v0.3.1 generated lock blob

on:
  push:
    branches:
      - fix/v0.3.1-runtime-dependencies
    paths:
      - .github/workflows/hotfix-lock-blob-v0.3.1.yml

permissions:
  contents: write

jobs:
  blob:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/v0.3.1-runtime-dependencies
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Regenerate exact lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify lock metadata
        run: npm run lock:check

      - name: Create unattached Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(base64 -w0 package-lock.json)"
          sha="$(gh api --method POST repos/${{ github.repository }}/git/blobs -f content="$payload" -f encoding=base64 --jq .sha)"
          echo "GENERATED_LOCK_BLOB_SHA=$sha"
