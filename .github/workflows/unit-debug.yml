name: Unit Debug

on:
  push:
    branches:
      - agent/autopilot-repair-loop

permissions:
  contents: read

jobs:
  unit-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unit tests with captured output
        id: unit
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee unit-test.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload unit diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log-${{ github.sha }}
          path: unit-test.log
          if-no-files-found: error
          retention-days: 1
      - name: Preserve unit test failure
        if: steps.unit.outputs.exit_code != '0'
        run: exit 1
