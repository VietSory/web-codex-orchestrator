name: Unit failure diagnose

on:
  push:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Print concise unit failures
        shell: bash
        run: |
          set +e
          npm test > unit.log 2>&1
          status=$?
          echo "=== FAILURE SUMMARY ==="
          grep -nE -B 4 -A 18 '^(not ok|# Subtest:)|AssertionError|ERR_ASSERTION|error TS|TypeError|ReferenceError|SyntaxError' unit.log | tail -n 500 || true
          echo "=== TEST TAIL ==="
          tail -n 80 unit.log
          exit "$status"
