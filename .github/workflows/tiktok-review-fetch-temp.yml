name: Temporary TikTok Review Fetch

on:
  push:
    branches:
      - chatgpt/tiktok-review-7647343159999073556
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact TikTok MP4 from media proxy
        shell: bash
        run: |
          set +e
          mkdir -p out/frames
          ID='7647343159999073556'
          for u in \
            "https://www.tikwm.com/video/media/hdplay/$ID.mp4" \
            "https://www.tikwm.com/video/media/play/$ID.mp4" \
            "https://tikwm.com/video/media/hdplay/$ID.mp4" \
            "https://tikwm.com/video/media/play/$ID.mp4"; do
            echo "TRY $u"
            rm -f out/candidate.bin
            curl -L --max-time 90 --retry 2 --retry-all-errors -A 'Mozilla/5.0' "$u" -o out/candidate.bin
            code=$?
            echo "curl_exit=$code bytes=$(stat -c%s out/candidate.bin 2>/dev/null || echo 0)"
            file out/candidate.bin 2>/dev/null || true
            if [ "$code" = 0 ] && file out/candidate.bin | grep -q 'ISO Media'; then
              mv out/candidate.bin out/target.mp4
              echo 'MEDIA_FETCH_OK'
              break
            fi
          done
          if [ ! -f out/target.mp4 ]; then
            echo 'MEDIA_FETCH_FAILED'
            exit 1
          fi
          xxd -l 32 out/target.mp4

      - name: Decode frames and transcribe exact MP4
        shell: bash
        run: |
          set -e
          python -m pip install -q --disable-pip-version-check faster-whisper Pillow
          python - <<'PY'
          import av
          from PIL import Image, ImageDraw
          from faster_whisper import WhisperModel

          media='out/target.mp4'
          c=av.open(media)
          vs=c.streams.video[0]
          duration=float(c.duration/av.time_base) if c.duration else 97.0
          print('MEDIA_DURATION', round(duration,3))
          print('VIDEO_CODEC', vs.codec_context.name, 'SIZE', vs.width, vs.height)
          targets=[i*5.0 for i in range(20)]
          got=[]; ti=0
          for frame in c.decode(video=0):
              if ti>=len(targets): break
              t=float(frame.time or 0.0)
              if t+0.05 >= targets[ti]:
                  im=frame.to_image()
                  im.thumbnail((480,854))
                  p=f'out/frames/frame-{ti+1:02d}-{t:05.1f}s.jpg'
                  im.save(p,quality=86)
                  got.append((t,im.copy()))
                  ti+=1
          c.close()
          print('FRAME_COUNT',len(got))

          if got:
              cols=4; cw=240; ch=445; rows=(len(got)+cols-1)//cols
              sheet=Image.new('RGB',(cols*cw,rows*ch),'white')
              for i,(t,im) in enumerate(got):
                  thumb=im.copy(); thumb.thumbnail((cw,410))
                  tile=Image.new('RGB',(cw,ch),'white')
                  tile.paste(thumb,((cw-thumb.width)//2,0))
                  ImageDraw.Draw(tile).text((5,415),f'{t:.1f}s',fill='black')
                  sheet.paste(tile,((i%cols)*cw,(i//cols)*ch))
              sheet.save('out/contact-sheet.jpg',quality=88)

          model=WhisperModel('base',device='cpu',compute_type='int8')
          segs,info=model.transcribe(media,beam_size=5,vad_filter=True)
          print(f'TRANSCRIPT_LANGUAGE {info.language} {info.language_probability:.4f}')
          with open('out/transcript.txt','w',encoding='utf-8') as f:
              for s in segs:
                  line=f'[{s.start:.2f}-{s.end:.2f}] {s.text.strip()}'
                  print('TRANSCRIPT',line)
                  f.write(line+'\n')
          PY

      - name: Upload review inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-review-inputs
          path: out/
          retention-days: 1
