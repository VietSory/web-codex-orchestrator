name: Regenerate package lock

on:
  push:
    branches:
      - repair/generated-package-lock

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: repair/generated-package-lock
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Regenerate lock metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify synchronized metadata
        run: npm run lock:check

      - name: Publish generated lock through temporary tag
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: regenerate package lock with npm"
          git tag -f wco-lockgen-temp-20260809
          git push --force origin refs/tags/wco-lockgen-temp-20260809
