name: One-time v0.3.1 lockfile regeneration

on:
  push:
    branches:
      - fix/v0.3.1-runtime-dependencies
    paths:
      - package.json

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/v0.3.1-runtime-dependencies
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Regenerate lockfile metadata exactly from package.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify lock metadata
        run: npm run lock:check

      - name: Commit regenerated lockfile and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hotfix-lock-v0.3.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/hotfix-lock-v0.3.1.yml
          git commit -m "chore: synchronize v0.3.1 runtime dependency lockfile"
          git push origin HEAD:fix/v0.3.1-runtime-dependencies
