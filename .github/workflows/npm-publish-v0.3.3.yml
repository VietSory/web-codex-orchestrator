name: Publish v0.3.3 to npm

on:
  push:
    branches:
      - release/v0.3.3
    paths:
      - .github/workflows/npm-publish-v0.3.3.yml

permissions:
  contents: read
  id-token: write

env:
  RELEASE_SHA: f991610141adfcdaa436b5802c8b1e5493faea0b
  PACKAGE_NAME: web-codex-orchestrator
  PACKAGE_VERSION: 0.3.3

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact qualified main
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Confirm exact release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(node -p "require('./package.json').name")" = "$PACKAGE_NAME"
          test "$(node -p "require('./package.json').version")" = "$PACKAGE_VERSION"
          test "$(node -p "require('./package.json').publishConfig.access")" = "public"

      - name: Set up Node and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Reconfirm distributable artifact
        run: |
          npm run pack:check
          npm run pack:smoke

      - name: Refuse overwrite of an existing version
        shell: bash
        run: |
          set -euo pipefail
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org >/tmp/npm-version 2>/tmp/npm-view-error; then
            echo "Refusing to publish: $PACKAGE_NAME@$PACKAGE_VERSION already exists in npm."
            cat /tmp/npm-version
            exit 1
          fi
          if ! grep -Eq 'E404|404 Not Found|is not in this registry' /tmp/npm-view-error; then
            echo "npm registry lookup failed for an unexpected reason; refusing publish."
            cat /tmp/npm-view-error
            exit 1
          fi
          echo "$PACKAGE_NAME@$PACKAGE_VERSION is not currently published."

      - name: Publish public package with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm publication
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..12}; do
            VERSION="$(npm view "$PACKAGE_NAME" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [ "$VERSION" = "$PACKAGE_VERSION" ]; then
              npm view "$PACKAGE_NAME@$PACKAGE_VERSION" name version dist.tarball dist.integrity repository --json --registry=https://registry.npmjs.org
              exit 0
            fi
            sleep 5
          done
          echo "npm did not expose $PACKAGE_NAME@$PACKAGE_VERSION after publish."
          exit 1
